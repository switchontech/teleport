kind: role
version: v7
metadata:
  name: super-admin
  description: Full cluster admin — editor + access + auditor + root SSH on all nodes
spec:
  allow:
    # root: full SSH access to every VS node
    # customer: standard shared VS login available to all roles
    logins:
      - root
      - customer
    node_labels:
      '*': '*'
    app_labels:
      '*': '*'
    db_labels:
      '*': '*'
    db_names:
      - '{{internal.db_names}}'
    db_roles:
      - '{{internal.db_roles}}'
    db_service_labels:
      '*': '*'
    db_users:
      - '{{internal.db_users}}'
    aws_role_arns:
      - '{{internal.aws_role_arns}}'
    azure_identities:
      - '{{internal.azure_identities}}'
    gcp_service_accounts:
      - '{{internal.gcp_service_accounts}}'
    kubernetes_groups:
      - '{{internal.kubernetes_groups}}'
    kubernetes_labels:
      '*': '*'
    kubernetes_resources:
      - kind: '*'
        name: '*'
        namespace: '*'
        verbs: ['*']
    kubernetes_users:
      - '{{internal.kubernetes_users}}'
    windows_desktop_labels:
      '*': '*'
    windows_desktop_logins:
      - '{{internal.windows_logins}}'

    rules:
      # From built-in "auditor" — ALL sessions/events cluster-wide, no
      # participant restriction (unlike access's own-sessions-only rule).
      - resources: [session]
        verbs: [list, read]
      - resources: [event]
        verbs: [list, read]
      - resources: [session_tracker]
        verbs: [list, read]

      # From built-in "editor" — full cluster config admin.
      - resources: [user]
        verbs: [list, create, read, update, delete]
      - resources: [role]
        verbs: [list, create, read, update, delete]
      - resources: [bot]
        verbs: [list, create, read, update, delete]
      - resources: [crown_jewel]
        verbs: [list, create, read, update, delete]
      - resources: [db_object_import_rule]
        verbs: [list, create, read, update, delete]
      - resources: [oidc]
        verbs: [list, create, read, update, delete]
      - resources: [saml]
        verbs: [list, create, read, update, delete]
      - resources: [github]
        verbs: [list, create, read, update, delete]
      - resources: [oidc_request]
        verbs: [list, create, read, update, delete]
      - resources: [saml_request]
        verbs: [list, create, read, update, delete]
      - resources: [github_request]
        verbs: [list, create, read, update, delete]
      - resources: [cluster_audit_config]
        verbs: [list, create, read, update, delete]
      - resources: [cluster_auth_preference]
        verbs: [list, create, read, update, delete]
      - resources: [auth_connector]
        verbs: [list, create, read, update, delete]
      - resources: [cluster_name]
        verbs: [list, create, read, update, delete]
      - resources: [cluster_networking_config]
        verbs: [list, create, read, update, delete]
      - resources: [session_recording_config]
        verbs: [list, create, read, update, delete]
      - resources: [external_audit_storage]
        verbs: [list, create, read, update, delete]
      - resources: [ui_config]
        verbs: [list, create, read, update, delete]
      - resources: [trusted_cluster]
        verbs: [list, create, read, update, delete]
      - resources: [remote_cluster]
        verbs: [list, create, read, update, delete]
      - resources: [token]
        verbs: [list, create, read, update, delete]
      - resources: [connection_diagnostic]
        verbs: [list, create, read, update, delete]
      - resources: [db]
        verbs: [list, create, read, update, delete]
      - resources: [database_certificate]
        verbs: [list, create, read, update, delete]
      - resources: [installer]
        verbs: [list, create, read, update, delete]
      - resources: [device]
        verbs: [list, create, read, update, delete, create_enroll_token, enroll]
      - resources: [mobile_device]
        verbs: [create_enroll_token]
      - resources: [db_service]
        verbs: [list, read]
      - resources: [instance]
        verbs: [list, read]
      - resources: [login_rule]
        verbs: [list, create, read, update, delete]
      - resources: [saml_idp_service_provider]
        verbs: [list, create, read, update, delete]
      - resources: [user_group]
        verbs: [list, create, read, update, delete]
      - resources: [plugin]
        verbs: [list, create, read, update, delete]
      - resources: [okta_import_rule]
        verbs: [list, create, read, update, delete]
      - resources: [okta_assignment]
        verbs: [list, create, read, update, delete]
      - resources: [lock]
        verbs: [list, create, read, update, delete]
      - resources: [integration]
        verbs: [list, create, read, update, delete, use]
      - resources: [billing]
        verbs: [list, create, read, update, delete]
      - resources: [cluster_alert]
        verbs: [list, create, read, update, delete]
      - resources: [access_list]
        verbs: [list, create, read, update, delete]
      - resources: [node]
        verbs: [list, create, read, update, delete]
      - resources: [app]
        verbs: [list, create, read, update, delete]
      - resources: [discovery_config]
        verbs: [list, create, read, update, delete]
      - resources: [security_report]
        verbs: [list, create, read, update, delete, use]
      - resources: [audit_query]
        verbs: [list, create, read, update, delete, use]
      - resources: [access_graph]
        verbs: [list, create, read, update, delete]
      - resources: [server_info]
        verbs: [list, create, read, update, delete]
      - resources: [access_monitoring_rule]
        verbs: [list, create, read, update, delete]
      - resources: [app_server]
        verbs: [list, create, read, update, delete]
      - resources: [vnet_config]
        verbs: [list, create, read, update, delete]
      - resources: [bot_instance]
        verbs: [list, create, read, update, delete]
      - resources: [access_graph_settings]
        verbs: [list, create, read, update, delete]
      - resources: [spiffe_federation]
        verbs: [list, create, read, update, delete]
      - resources: [notification]
        verbs: [list, create, read, update, delete]
      - resources: [static_host_user]
        verbs: [list, create, read, update, delete]
      - resources: [user_task]
        verbs: [list, create, read, update, delete]
      - resources: [aws_identity_center]
        verbs: [list, create, read, update, delete]
      - resources: [contact]
        verbs: [list, create, read, update, delete]
      - resources: [workload_identity]
        verbs: [list, create, read, update, delete]
      - resources: [autoupdate_version]
        verbs: [list, create, read, update, delete]
      - resources: [autoupdate_config]
        verbs: [list, create, read, update, delete]
      - resources: [autoupdate_agent_rollout]
        verbs: [list, read]
      - resources: [autoupdate_agent_report]
        verbs: [list, read]
      - resources: [git_server]
        verbs: [list, create, read, update, delete]
      - resources: [health_check_config]
        verbs: [list, create, read, update, delete]

  options:
    max_session_ttl: 24h0m0s
    ssh_file_copy: true
    forward_agent: true
    enhanced_recording:
      - command
      - network
    record_session:
      default: best_effort
