kind: role
version: v7
metadata:
  name: ssh-access-watcher
  description: >-
    Background robot account. Not for people — auto-updates the SSH
    login list when new servers join.
spec:
  allow:
    rules:
      - resources: [node]
        verbs: [list, read]
      - resources: [role]
        verbs: [list, read, update]
  options:
    max_session_ttl: 87600h0m0s
